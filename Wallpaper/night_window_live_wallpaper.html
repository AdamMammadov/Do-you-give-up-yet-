<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Window — live wallpaper</title>
<meta name="theme-color" content="#020610">
<style>
:root{--ink:#eaf2ff;--soft:rgba(214,228,255,.7);--accent:#7db2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);
  font-family:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
html.idle,html.idle *{cursor:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 40%;opacity:0;
  transition:opacity .8s ease;pointer-events:none}
video.on{opacity:1}
#scrim{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.42) 100%),
             linear-gradient(to top,rgba(2,6,16,.6),transparent 28%)}
#veil{position:fixed;inset:0;background:#000;pointer-events:none;transition:opacity 2.6s ease;opacity:1}
#veil.off{opacity:0}

#caption{position:fixed;left:50%;bottom:clamp(30px,8vh,90px);transform:translateX(-50%);
  width:min(86vw,940px);text-align:center;pointer-events:none;min-height:2.6em}
#capText{display:inline-block;font-size:clamp(20px,2.7vw,38px);font-weight:300;letter-spacing:.012em;line-height:1.35;
  text-shadow:0 2px 26px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.7);opacity:0;transition:opacity .7s ease}
#capText.show{opacity:1}
#capText.dir{font-style:italic;color:var(--soft);font-size:clamp(16px,2vw,26px)}
#capText.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:4px;background:currentColor;
  vertical-align:-.13em;animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
html.nocap #caption{display:none}

#clock{position:fixed;top:clamp(20px,4vh,48px);right:clamp(22px,3.4vw,56px);text-align:right;pointer-events:none;
  text-shadow:0 2px 20px rgba(0,0,0,.75)}
#time{font-size:clamp(30px,4.2vw,64px);font-weight:200;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
#date{margin-top:.55em;font-size:clamp(12px,1.25vw,17px);color:var(--soft);letter-spacing:.05em}

#dock{position:fixed;left:clamp(16px,2.4vw,40px);bottom:clamp(16px,3vh,32px);display:flex;align-items:center;gap:4px;
  padding:5px 8px;border-radius:999px;background:rgba(8,14,30,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(160,190,255,.14);transition:opacity .5s ease,transform .5s ease}
html.idle #dock{opacity:0;transform:translateY(8px);pointer-events:none}
#dock button{all:unset;box-sizing:border-box;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink);opacity:.82;cursor:pointer;transition:background .2s,opacity .2s}
#dock button:hover{background:rgba(125,178,255,.16);opacity:1}
#dock button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#dock button[aria-pressed="false"]{opacity:.42}
#dock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#vol{width:74px;height:3px;margin:0 8px 0 2px;accent-color:#9cc4ff;cursor:pointer}

#hint{position:fixed;top:clamp(20px,4vh,48px);left:50%;transform:translateX(-50%);font-size:clamp(13px,1.3vw,16px);
  color:var(--soft);letter-spacing:.03em;text-shadow:0 2px 14px rgba(0,0,0,.8);opacity:0;transition:opacity .8s ease;pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
#nameBox{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,6,16,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#nameBox.on{display:grid}
#nameBox div{padding:22px 26px;border-radius:18px;background:rgba(10,18,38,.85);border:1px solid rgba(160,190,255,.18);text-align:center}
#nameBox label{display:block;margin-bottom:12px;color:var(--soft);font-size:15px}
#nameBox input{all:unset;box-sizing:border-box;width:260px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.07);
  border:1px solid rgba(160,190,255,.25);color:var(--ink);font-size:20px;text-align:center;user-select:text;-webkit-user-select:text}
#nameBox input:focus{border-color:var(--accent)}
@media(max-width:700px){#dock{left:50%;transform:translateX(-50%)}html.idle #dock{transform:translate(-50%,8px)}#caption{bottom:88px}#vol{width:52px}}
@media(prefers-reduced-motion:reduce){#capText,video,#veil{transition-duration:.01s}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A woman smiling in front of a night city skyline under a starry sky" role="img"></canvas>
<video id="vA" muted playsinline preload="auto"></video>
<video id="vB" muted playsinline preload="auto"></video>
<div id="scrim"></div>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="caption" aria-live="polite"><span id="capText"></span></div>
<div id="hint"></div>
<div id="veil"></div>

<div id="dock" role="toolbar" aria-label="Wallpaper controls">
  <button id="bSound" aria-pressed="true" title="Sound (M)" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <input id="vol" type="range" min="0" max="100" value="50" aria-label="Volume">
  <button id="bCaps" aria-pressed="true" title="Captions (C)" aria-label="Captions"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M10 10.2a2 2 0 1 0 0 3.6M16 10.2a2 2 0 1 0 0 3.6"/></svg></button>
  <button id="bName" title="Change name (N)" aria-label="Change name"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1-3.6 3.8-5.5 7-5.5s6 1.9 7 5.5"/></svg></button>
  <button id="bVoice" aria-pressed="false" title="Her voice from the clips (V)" aria-label="Her voice"><svg viewBox="0 0 24 24"><path d="M5 6h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-6l-4 3v-3H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg></button>
  <button id="bNext" title="Next moment (Space)" aria-label="Next moment"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
  <button id="bFull" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="nameBox"><div><label for="nameIn">What should she call you?</label><input id="nameIn" maxlength="24" autocomplete="off"></div></div>
<audio id="music" loop preload="none"></audio>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   CONFIG — everything you may want to change lives in this block
   ══════════════════════════════════════════════════════════════ */
const CONFIG={
  name:"Adam",                 // can also be changed live with the N key
  musicFile:"music.mp3",       // put your own song next to this file; if it is missing, a generated lo-fi loop plays
  volume:.5,
  clipsFolder:"clips/",        // put image-to-video clips here (see clip_prompts.md). .mp4 or .webm
  greetingVariants:[           // used from the second loop onwards (the first loop always uses the exact greeting)
    "Hi {name}, how was your day?","Welcome back, {name}.","Hey {name}… I was waiting for you."
  ]
};
/* One "act" = one moment of the story. If a clip exists for it, the clip plays;
   otherwise the still photo is used with a camera move. lines: [ms after act start, text, options]

    lines:[[900,"Hi {name}, how was your day?"]]},

    lines:[[600,"waves",{dir:1,clipOnly:1}]]},
  {id:"shy",clip:"03_shy",dur:5400,cam:{z:1.13,zx:.36,zy:.44,px:0,py:0},blush:1,
    lines:[[500,"covers her smile",{dir:1,clipOnly:1}],[1900,"hehe…"]]},

/* ═════ captions (typewriter) ═════ */
const capEl=$("capText");let capTok=0,capHide=0;
function say(text,opt={}){
  if(!capsOn)return;
  const tk=++capTok;clearTimeout(capHide);
  text=fill(text);
  capEl.classList.remove("show");
  setTimeout(()=>{
    if(tk!==capTok)return;
    capEl.classList.toggle("dir",!!opt.dir);capEl.textContent="";capEl.classList.add("show","typing");
    let i=0;const speed=opt.dir?26:46;
    (function type(){
      if(tk!==capTok)return;
      i++;capEl.textContent=text.slice(0,i);
      if(i<text.length)setTimeout(type,speed+Math.random()*28);
      else{capEl.classList.remove("typing");capHide=setTimeout(()=>{if(tk===capTok)capEl.classList.remove("show");},opt.hold||2700+text.length*32);}
    })();

}
function hush(){capTok++;clearTimeout(capHide);capEl.classList.remove("show","typing");}

/* ═════ canvas scene ═════ */
const cv=$("scene"),ctx=cv.getContext("2d",{alpha:false});

function sprite(r,g,b){const c=document.createElement("canvas");c.width=c.height=48;const x=c.getContext("2d"),
  gr=x.createRadialGradient(24,24,0,24,24,24);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.18,`rgba(${r},${g},${b},.85)`);
  gr.addColorStop(.5,`rgba(${r},${g},${b},.22)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gr;x.fillRect(0,0,48,48);return c;}

  return{x,y,b,k,ph:Math.random()*6.283,sp:.6+Math.random()*2.4,blink:!isStar&&y>620&&Math.random()<.14,bs:.25+Math.random()*.5,star:isStar};});}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}

  W0=photo.naturalWidth;H0=photo.naturalHeight;

/* camera: current values glide towards the target of the active act */
const IDLE_CAM={z:1.05,zx:.4,zy:.4,px:0,py:0};
const ALIGNED={z:1,zx:.35,zy:.4,px:0,py:0};   // identical to CSS object-fit:cover; object-position:35% 40% used by the videos
const cam={...IDLE_CAM},camT={...IDLE_CAM};
let blush=0,blushT=0,blushPulse=0,cityF=0,cityT=0;
let mx=0,my=0,tmx=0,tmy=0,curX=-1,curY=-1,haveCur=false;
function setM(par,ex,ey){
  const k=Math.max(cw/W0,ch/H0),dw=W0*k,dh=H0*k,dx=(cw-dw)*FOCUS_X,dy=(ch-dh)*FOCUS_Y;
  const z=cam.z,zx=cam.zx*cw,zy=cam.zy*ch;let px=cam.px*cw,py=cam.py*ch;
  const L0=zx+z*(dx-zx),R0=zx+z*(dx+dw-zx),T0=zy+z*(dy-zy),B0=zy+z*(dy+dh-zy);
  const mgx=Math.min(14,Math.max(0,(R0-L0-cw)/2*.5)),mgy=Math.min(14,Math.max(0,(B0-T0-ch)/2*.5));
  const lox=cw-R0+mgx,hix=-L0-mgx,loy=ch-B0+mgy,hiy=-T0-mgy;
  px=lox>hix?(lox+hix)/2:clamp(px,lox,hix);py=loy>hiy?(loy+hiy)/2:clamp(py,loy,hiy);
  const a=z*k;
  ctx.setTransform(dpr*a,0,0,dpr*a,dpr*(zx+z*(dx-zx)+px*par+ex),dpr*(zy+z*(dy-zy)+py*par+ey));
}

/* atmosphere state */
let plane=null,nextPlane=9,shoot=null,nextShoot=4,lowfx=false;
const FF=Array.from({length:26},()=>({ax:Math.random(),ay:.35+Math.random()*.6,ph:Math.random()*6.28,s:.5+Math.random()*1.4,x:0,y:0}));
const sparks=[],rings=[];

function update(t,dt){
  const kc=1-Math.exp(-dt*1.35),km=1-Math.exp(-dt*3);
  for(const k in cam)cam[k]+=(camT[k]-cam[k])*kc;
  blush+=(blushT-blush)*(1-Math.exp(-dt*1.8));blushPulse=Math.max(0,blushPulse-dt*.9);
  cityF+=(cityT-cityF)*(1-Math.exp(-dt*1.5));
  mx+=(tmx-mx)*km;my+=(tmy-my)*km;
  if(!plane&&t>nextPlane)plane={x:W0+60,y:110+Math.random()*100,v:-31-Math.random()*12};
  if(plane){plane.x+=plane.v*dt;plane.y+=2.4*dt;if(plane.x<-80){plane=null;nextPlane=t+55+Math.random()*60;}}
  if(!shoot&&t>nextShoot&&!lowfx)shoot={x:900+Math.random()*650,y:30+Math.random()*190,vx:-420,vy:190,age:0};
  if(shoot){shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;shoot.age+=dt;if(shoot.age>.9){shoot=null;nextShoot=t+14+Math.random()*20;}}
}

function drawPoints(t){
  ctx.globalCompositeOperation="lighter";
  const half=lowfx?2:1;
  for(let i=0;i<POINTS.length;i+=half){
    const p=POINTS[i],tw=.5+.5*Math.sin(t*p.sp+p.ph);let a,s;
    if(p.star){a=(.12+.55*p.b)*(.25+.75*tw);s=4+p.b*8;}
    else{
      a=(.1+.45*p.b)*(.55+.45*tw)*(1+cityF*.6);s=5+p.b*10;
      if(p.blink&&Math.sin(t*p.bs+p.ph*3)<-.2){
        ctx.globalCompositeOperation="source-over";ctx.globalAlpha=.85;ctx.fillStyle="#030814";
        ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,6.283);ctx.fill();ctx.globalCompositeOperation="lighter";continue;
      }
    }
    ctx.globalAlpha=Math.min(1,a);ctx.drawImage(SP[p.k],p.x-s/2,p.y-s/2,s,s);
  }
  ctx.globalAlpha=1;
}
function drawSky(t){
  ctx.globalCompositeOperation="lighter";
  const a=.1+.03*Math.sin(t*.6)+cityF*.14,g=ctx.createRadialGradient(1250,540,20,1250,540,520);
  g.addColorStop(0,`rgba(70,130,255,${a})`);g.addColorStop(1,"rgba(70,130,255,0)");
  ctx.fillStyle=g;ctx.fillRect(700,200,W0-700,H0-200);
  if(plane){
    ctx.globalAlpha=.55;ctx.drawImage(SP.amber,plane.x-3,plane.y-3,6,6);
    if(Math.sin(t*4.6)>.9){ctx.globalAlpha=.9;ctx.drawImage(SP.white,plane.x-9,plane.y-9,18,18);}
    ctx.globalAlpha=1;
  }
  if(shoot){
    const k=shoot.age/.9,al=Math.sin(Math.PI*k)*.85,tl=.09,x1=shoot.x-shoot.vx*tl,y1=shoot.y-shoot.vy*tl;
    const g2=ctx.createLinearGradient(shoot.x,shoot.y,x1,y1);g2.addColorStop(0,`rgba(255,248,238,${al})`);g2.addColorStop(1,"rgba(255,200,140,0)");
    ctx.strokeStyle=g2;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(x1,y1);ctx.stroke();
  }
}
function drawFace(t){
  const b=Math.max(blush,blushPulse);
  if(b>.01){
    for(const[x,y]of[[510,472],[708,480]]){
      const g=ctx.createRadialGradient(x,y,3,x,y,84);g.addColorStop(0,`rgba(255,110,145,${.42*b})`);g.addColorStop(1,"rgba(255,105,140,0)");
      ctx.globalCompositeOperation="soft-light";ctx.fillStyle=g;ctx.fillRect(x-86,y-86,172,172);
      const g2=ctx.createRadialGradient(x,y,3,x,y,70);g2.addColorStop(0,`rgba(255,125,155,${.07*b})`);g2.addColorStop(1,"rgba(255,120,150,0)");
      ctx.globalCompositeOperation="screen";ctx.fillStyle=g2;ctx.fillRect(x-72,y-72,144,144);
    }
  }
  const f=.05+.03*Math.sin(t*1.7)+.02*Math.sin(t*4.3)+cityF*.03,g3=ctx.createRadialGradient(690,430,10,690,430,190);
  g3.addColorStop(0,`rgba(90,150,255,${f})`);g3.addColorStop(.6,`rgba(90,150,255,${f*.3})`);g3.addColorStop(1,"rgba(90,150,255,0)");
  ctx.globalCompositeOperation="screen";ctx.fillStyle=g3;ctx.fillRect(490,240,400,380);
}
function drawOverlay(t,dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation="lighter";

    for(const f of FF){
      let x=f.ax*cw+Math.sin(t*.2*f.s+f.ph)*cw*.05,y=f.ay*ch+Math.cos(t*.17*f.s+f.ph*1.3)*ch*.04;
      if(haveCur){const dx=curX-x,dy=curY-y,d=Math.hypot(dx,dy);if(d<220){const pull=(1-d/220)*.35;x+=dx*pull;y+=dy*pull;}}
      f.x+=(x-f.x)*.08;f.y+=(y-f.y)*.08;if(!f.x)f.x=x,f.y=y;
      ctx.globalAlpha=.16+.3*Math.pow(Math.sin(t*.9*f.s+f.ph),2);const s=10+f.s*5;ctx.drawImage(SP.amber,f.x-s/2,f.y-s/2,s,s);
    }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.life-=dt;if(p.life<=0){sparks.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=20*dt;ctx.globalAlpha=clamp(p.life/1.2)*.9;ctx.drawImage(SP.white,p.x-5,p.y-5,10,10);
  }

    const r=rings[i];r.age+=dt;if(r.age>1){rings.splice(i,1);continue;}
    ctx.globalAlpha=(1-r.age)*.5;ctx.strokeStyle="rgba(170,205,255,1)";ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(r.x,r.y,8+r.age*70,0,6.283);ctx.stroke();
  }

}
function draw(t,dt){
  ctx.globalCompositeOperation="source-over";ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#02040c";ctx.fillRect(0,0,cv.width,cv.height);
  if(!ready)return;
  const amp=REDUCED?0:clamp((cam.z-1)/.03),bgX=-mx*10*amp,bgY=-my*6*amp,sX=mx*8*amp-cityF*9,sY=my*5*amp;
  /* background world */
  setM(1,bgX,bgY);ctx.drawImage(L.plate,0,0);
  drawSky(t);drawPoints(t);
  /* the woman: breathing + a slow sway, sharp or softly out of focus */
  setM(1.04,sX,sY);

  ctx.translate(.45*W0,H0);ctx.scale(b,b);ctx.rotate(.0012*Math.sin(t*.5)*amp);ctx.translate(-.45*W0,-H0+ -1.2*br*amp);
  ctx.globalCompositeOperation="source-over";

  ctx.globalAlpha=1-clamp(cityF*.95);if(ctx.globalAlpha>.01)ctx.drawImage(L.subj,0,0);ctx.globalAlpha=1;

/* ═════ story director ═════ */
const clipInfo={};let actIdx=-1,actTok=0,timers=[],loops=0,lastAdv=0;
const vids=[$("vA"),$("vB")];let vi=0;
function probe(url){return new Promise(res=>{
  const v=document.createElement("video");v.preload="metadata";v.muted=true;let done=false;
  const fin=r=>{if(done)return;done=true;v.onloadedmetadata=v.onerror=null;v.removeAttribute("src");try{v.load();}catch(e){}res(r);};
  v.onloadedmetadata=()=>fin(isFinite(v.duration)&&v.duration>0?v.duration:6);v.onerror=()=>fin(0);setTimeout(()=>fin(0),2500);v.src=url;});}
async function probeClips(){
  await Promise.all(ACTS.map(async a=>{
    for(const ext of[".mp4",".webm"]){const url=CONFIG.clipsFolder+a.clip+ext,d=await probe(url);if(d){clipInfo[a.id]={url,dur:d};return;}}
  }));
}
function setDuck(){
  duckF=(voiceOn&&vids.some(x=>x.classList.contains("on")&&!x.muted))?.3:1;Music.applyVolume(.5);
}
function playClip(info,tok){
  const v=vids[vi^=1],o=vids[vi^1];
  v.onended=()=>{if(tok===actTok)advance(true);};
  v.src=info.url;v.currentTime=0;v.loop=false;v.muted=!voiceOn;
  const ok=()=>{v.classList.add("on");o.classList.remove("on");setDuck();};
  const go=()=>{const p=v.play();if(p)p.then(ok).catch(()=>{v.muted=true;const q=v.play();if(q)q.then(ok).catch(()=>{});});};
  if(v.readyState>=2)go();else v.onloadeddata=go;
}
function hideVideos(){vids.forEach(v=>{v.classList.remove("on");});setDuck();}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function playAct(i){
  clearTimers();const tok=++actTok;actIdx=i;const a=ACTS[i],clip=clipInfo[a.id];
  Object.assign(camT,IDLE_CAM,a.cam||{});blushT=a.blush||0;cityT=a.city?1:0;
  if(clip){Object.assign(camT,ALIGNED);playClip(clip,tok);}else hideVideos();
  a.lines.forEach(([ms,text,o])=>{
    o=o||{};if(o.clipOnly&&!clip)return;
    let s=text;if(i===0&&loops>0&&!o.dir)s=CONFIG.greetingVariants[Math.floor(Math.random()*CONFIG.greetingVariants.length)];
    timers.push(setTimeout(()=>{if(tok===actTok)say(s,o);},ms));
  });
  const dur=clip?clip.dur*1000+250:a.dur;
  timers.push(setTimeout(()=>{if(tok===actTok)advance(true);},dur));
}
function advance(auto){
  const n=performance.now();if(!auto&&n-lastAdv<500)return;lastAdv=n;
  let i=actIdx+1;if(i>=ACTS.length){i=0;loops++;}
  for(let g=0;g<ACTS.length&&ACTS[i].optional&&!clipInfo[ACTS[i].id];g++){i++;if(i>=ACTS.length){i=0;loops++;}}
  playAct(i);
}

/* ═════ audio wake-up, input and UI ═════ */
let awake=false,fileState=0,hintTimer=0;
const hintEl=$("hint");
function hint(text,ms){hintEl.textContent=text;hintEl.classList.add("on");clearTimeout(hintTimer);if(ms)hintTimer=setTimeout(()=>hintEl.classList.remove("on"),ms);}
music.addEventListener("error",()=>{fileState=2;Music.setFile(false);Music.startGenerated();});
function tryFile(){
  if(fileState!==0)return;fileState=3;
  if(!music.getAttribute("src")){music.src=CONFIG.musicFile;music.loop=true;}
  music.volume=CONFIG.volume*duckF;music.muted=!soundOn;
  music.play().then(()=>{fileState=1;Music.setFile(true);}).catch(err=>{
    if(err&&err.name==="NotAllowedError")fileState=0;else{fileState=2;Music.setFile(false);Music.startGenerated();}
  });
}
function wake(){
  Music.ensure();Music.resume();tryFile();
  if(!awake){awake=true;hintEl.classList.remove("on");Music.applyVolume(1.5);}
}
function setSound(v){soundOn=v;store.set("sound",v);$("bSound").setAttribute("aria-pressed",String(v));Music.applyVolume(.15);}
function setCaps(v){capsOn=v;store.set("caps",v);$("bCaps").setAttribute("aria-pressed",String(v));root.classList.toggle("nocap",!v);if(!v)hush();}
function setVoice(v){
  voiceOn=v;store.set("voice",v);$("bVoice").setAttribute("aria-pressed",String(v));
  vids.forEach(x=>{x.muted=!v;});setDuck();hint(v?"Her voice from the clips is on":"Her voice is off",2200);
}
function toggleFull(){if(document.fullscreenElement)document.exitFullscreen&&document.exitFullscreen();else if(root.requestFullscreen)root.requestFullscreen().catch(()=>{});}
function openName(){$("nameBox").classList.add("on");const i=$("nameIn");i.value=CONFIG.name;setTimeout(()=>{i.focus();i.select();},30);}
function closeName(save){
  const i=$("nameIn");$("nameBox").classList.remove("on");
  if(save){const v=i.value.trim();if(v){CONFIG.name=v.slice(0,24);store.set("name",CONFIG.name);say("Hi {name}, nice to meet you.");}}
}
const REACT=["Hey!","hehe…","That tickles.","I'm right here."];
function react(x,y){
  blushPulse=1;rings.push({x,y,age:0});
  for(let i=0;i<9;i++){const a=Math.random()*6.283,s=40+Math.random()*90;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.8+Math.random()*.6});}
  say(REACT[Math.floor(Math.random()*REACT.length)],{hold:1800});
}
let idleT=0;
function poke(){root.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>root.classList.add("idle"),3200);}
window.addEventListener("pointermove",e=>{
  tmx=(e.clientX/innerWidth-.5)*2;tmy=(e.clientY/innerHeight-.5)*2;curX=e.clientX;curY=e.clientY;haveCur=e.pointerType==="mouse";poke();
},{passive:true});
document.documentElement.addEventListener("mouseleave",()=>{haveCur=false;});
window.addEventListener("pointerdown",e=>{
  wake();if(e.target.closest("#dock,#nameBox"))return;
  react(e.clientX,e.clientY);poke();
},{passive:true});
window.addEventListener("pointerup",wake,{passive:true});
window.addEventListener("click",wake,{passive:true});
window.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target&&e.target.id==="nameIn"){if(e.key==="Enter")closeName(true);else if(e.key==="Escape")closeName(false);return;}
  wake();const k=e.key.toLowerCase();
  if(k===" "||k==="arrowright"||k==="enter"){e.preventDefault();if(!e.repeat)advance(false);}
  else if(e.repeat)return;
  else if(k==="m")setSound(!soundOn);
  else if(k==="v")setVoice(!voiceOn);
  else if(k==="c")setCaps(!capsOn);
  else if(k==="n"){e.preventDefault();openName();}
  else if(k==="f")toggleFull();
  poke();
});
$("bSound").onclick=()=>setSound(!soundOn);$("bCaps").onclick=()=>setCaps(!capsOn);
$("bName").onclick=openName;$("bNext").onclick=()=>advance(false);$("bVoice").onclick=()=>setVoice(!voiceOn);$("bFull").onclick=toggleFull;
$("nameBox").addEventListener("pointerdown",e=>{if(e.target.id==="nameBox")closeName(false);});
const vol=$("vol");vol.value=Math.round(CONFIG.volume*100);
vol.oninput=()=>{CONFIG.volume=vol.value/100;store.set("vol",CONFIG.volume);Music.applyVolume(.1);};
$("bSound").setAttribute("aria-pressed",String(soundOn));$("bCaps").setAttribute("aria-pressed",String(capsOn));$("bVoice").setAttribute("aria-pressed",String(voiceOn));root.classList.toggle("nocap",!capsOn);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){Music.suspend();if(fileState===1)music.pause();}
  else{Music.resume();if(fileState===1&&soundOn)music.play().catch(()=>{});}
});
function tickClock(){
  const d=new Date();$("time").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  $("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
}
tickClock();setInterval(tickClock,10000);

/* ═════ main loop with an automatic lighter mode on weak machines ═════ */
let gAcc=0,gN=0,gBad=0,gLast=performance.now(),t0=performance.now();
function governor(now){
  const dt=now-gLast;gLast=now;if(lowfx||document.hidden||dt>250)return;
  gAcc+=dt;gN++;if(gN<60)return;
  gBad=gAcc/gN>30?gBad+1:0;gAcc=0;gN=0;
  if(gBad>=2){lowfx=true;maxDpr=1;resize();}
}
let lastF=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-lastF)/1000);lastF=now;
  try{update((now-t0)/1000,dt);draw((now-t0)/1000,dt);}
  catch(e){ERR.push(String(e&&e.stack||e));if(ERR.length>20)ERR.shift();}
  governor(now);
}
window.addEventListener("error",e=>{ERR.push(String(e.message||e));});
window.__WP__={goto:i=>playAct(i),errors:ERR,cam,camT,clipInfo,Music,state:()=>({act:actIdx,loops,ready,lowfx,awake,fileState,cityF,blush}),
  setCity:v=>{cityT=v;},setBlush:v=>{blushT=v;}};

(async function boot(){
  try{await buildLayers();}catch(e){ERR.push("assets: "+e);return;}
  ready=true;requestAnimationFrame(frame);
  await probeClips();
  root.dataset.clips=Object.keys(clipInfo).length;
  if(clipInfo[ACTS[0].id]){Object.assign(cam,ALIGNED);Object.assign(camT,ALIGNED);}
  $("veil").classList.add("off");
  setTimeout(()=>{hint(window.matchMedia("(pointer:coarse)").matches?"Tap to turn on the music":"Click anywhere to turn on the music",0);},1800);
  setTimeout(()=>advance(true),2000);
  setTimeout(()=>{if(!awake)hint("Click anywhere to turn on the music",0);},2500);
})();
</script>
